<!DOCTYPE html>
<html lang="en">
    <head>
        <title >Age Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="main">
            <h1>Age Calculator</h1><br>
            <label for="age"><b>Enter your Date of Birth:</b></label><br><br>
            <input id="age" type="date" required><br><br>
            <button id="btn" type="submit" onclick="calculateAge()">Calculate Age</button><br><br>
            <p id="birthday"></p>
            <p id="answer">Know Your Age</p>
        </div>
        <script src="script.js"></script>
    </body>
    
</html>
